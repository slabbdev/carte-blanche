# Render Blueprint — one-click deploy of Carte Blanche.
# The demo instance runs at https://carte-blanche-6jgo.onrender.com
# (free plan: cold starts after 15 min idle, first request wakes it).
#
# This service is deliberately Render-native:
#   - health checks on /healthz (rails mode + journal length + catalog mode)
#   - auto-deploy on every commit to main
#   - the sealed journal ships in-repo state; the TSA anchor endpoint
#     (/api/journal/anchor.tsr|.tsq) is publicly verifiable with openssl
#
# One-click friendly: everything below deploys on the FREE plan. Secrets are
# `sync: false` — Render prompts for them at deploy time (leave blank to run
# on mock rails; fill them for live sandbox purchases and the Channel3 catalog).
services:
  - type: web
    name: carte-blanche
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm install --no-audit --no-fund --prefix web && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # Preview Environments: every pull request gets its own throwaway instance
    # (free plan included) — sponsor/demo changes can be reviewed live before
    # they touch main. Journal state stays per-instance, so previews never
    # write into the production chain.
    previewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_ENV
        value: sandbox
      - key: STATE_DIR
        value: /var/data/carte-blanche # requires a paid disk — on the free plan the journal is per-deploy (documented, not hidden)
      - key: CHANNEL3_URL
        value: https://api.trychannel3.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false # webhook: PAYMENT.CAPTURE.COMPLETED + CHECKOUT.ORDER.APPROVED -> /api/webhooks/paypal
      - key: CHANNEL3_API_KEY
        sync: false
      - key: TSA_URLS
        sync: false
      - key: OPENAI_API_KEY
        sync: false # optional — autopilot runs its LLM policy when set, scripted policy otherwise

  # Hourly TSA anchor: keeps the RFC 3161 "provable WHEN" continuous instead of
  # anchoring only when a purchase happens. POSTs the public additive-evidence
  # endpoint; each token lands in the sealed journal, openssl-verifiable.
  # NOTE: cron jobs are a paid plan — uncomment to enable, or remove for a
  # strictly free one-click deploy.
  # - type: cron-job
  #   name: carte-blanche-anchor
  #   runtime: node
  #   plan: starter
  #   region: frankfurt
  #   schedule: "17 * * * *"
  #   buildCommand: echo "no build needed — the job is a single curl"
  #   command: curl -fsS -X POST https://your-app.onrender.com/api/journal/anchor
