<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>API reference — Carte Blanche</title>
<style>
  body { margin: 0; background: #0a0f16; color: #e6edf3; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 26px 20px 60px; }
  h1 { font-size: 22px; }
  h1 .card { display: inline-block; background: #fff; color: #0a0f16; border-radius: 6px; padding: 1px 9px; font-weight: 800; }
  .muted { color: #8b98a9; font-size: 13px; }
  a { color: #60a5fa; text-decoration: none; }
  #redoc { margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="card">CARTE</span> BLANCHE · API reference</h1>
  <p class="muted">
    Machine-readable contract: <a href="/openapi.json">/openapi.json</a> · generated reference below.
    The same spec feeds APIMatic for SDK generation — every endpoint documented here is the live implementation.
  </p>
  <div id="redoc"></div>
</div>
<script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
<script>
  if (window.Redoc) {
    Redoc.init("/openapi.json", { hideDownloadButton: false, theme: { colors: { primary: { main: "#2563eb" } } } }, document.getElementById("redoc"));
  } else {
    document.getElementById("redoc").innerHTML =
      '<p class="muted">Reference renderer unavailable offline — the raw contract is at <a href="/openapi.json">/openapi.json</a>.</p>';
  }
</script>
</body>
</html>
