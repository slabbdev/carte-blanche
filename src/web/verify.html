<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verify — Carte Blanche</title>
<style>
  :root {
    --bg: #f2f4f8; --panel: #ffffff; --border: #e7e9ee; --text: #001f33;
    --muted: #566173; --blue: #0070e0; --navy: #001f33;
    --green: #00865a; --red: #b42715;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --shadow: 0 1px 2px rgba(0, 31, 51, 0.06), 0 1px 6px rgba(0, 31, 51, 0.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 "PayPal Sans", "Helvetica Neue", Helvetica, Arial, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--blue); text-decoration: none; }
  .topbar { height: 60px; background: #fff; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 16px; padding: 0 24px; }
  .wordmark { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; user-select: none; }
  .wordmark .pay { color: var(--navy); }
  .wordmark .pal { color: var(--blue); }
  .toplabel { padding-left: 16px; border-left: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 30px 20px 80px; }

  .verdict { border-radius: 12px; padding: 20px 22px; font-size: 19px; font-weight: 800; margin-bottom: 16px; box-shadow: var(--shadow); }
  .verdict.ok { border: 1px solid #bfe5d4; background: #f0faf5; color: var(--green); }
  .verdict.bad { border: 1px solid #f3cfc7; background: #fdf3f1; color: var(--red); }

  .lens { display: flex; gap: 8px; margin-bottom: 18px; }
  .lens button { background: #fff; border: 1px solid #c8cdd6; color: var(--text); font-weight: 600; }
  .lens button.active { background: var(--navy); border-color: var(--navy); color: #fff; }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 12px; }

  /* human lens */
  .story { font-size: 16.5px; line-height: 1.65; }
  .story b { font-weight: 700; }
  .story .num { font-weight: 800; }
  .facts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .fact { background: #f7f9fc; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 130px; }
  .fact .k { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: var(--muted); text-transform: uppercase; }
  .fact .v { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .plainline { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 14.5px; align-items: baseline; }
  .plainline:first-of-type { border-top: 0; }
  .mark { font-weight: 800; flex: 0 0 14px; }
  .mark.ok { color: var(--green); } .mark.bad { color: var(--red); }

  /* evidence lens */
  .check { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 14px; align-items: baseline; }
  .check:first-of-type { border-top: 0; }
  .detail { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; font-family: var(--mono); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 8px; }
  td { padding: 5px 8px; border-top: 1px solid var(--border); font-family: var(--mono); word-break: break-all; }
  .kv { display: grid; grid-template-columns: 200px 1fr; gap: 4px 14px; font-size: 13.5px; }
  .kv .k { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  pre { background: #f7f9fc; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 11px; overflow: auto; max-height: 420px; color: #26384d; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .pill.ok { background: #e2f5ec; color: var(--green); }
  .pill.no { background: #fdeae6; color: var(--red); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 26px; }
</style>
</head>
<body>

<div class="topbar">
  <a class="wordmark" href="/"><span class="pay">Carte</span><span class="pal">Blanche</span></a>
  <span class="toplabel">Public verification — no account needed</span>
</div>

<div class="wrap">
  <div id="root"><p style="color:var(--muted)">verifying…</p></div>
  <p class="foot">Integration concept — simulation on sandbox rails. Not an official PayPal product.</p>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const id = location.pathname.split("/").pop();
const kind = id.startsWith("rcpt-") ? "receipts" : id.startsWith("deny-") ? "denials" : null;

/** Refusal reason codes → one plain sentence a buyer or merchant understands. */
const PLAIN_REASON = {
  OVER_PER_TRANSACTION: "the price was above the per-purchase limit the human signed",
  OVER_TOTAL_CAP: "the purchase would have pushed the total budget past its cap",
  PAYEE_NOT_ALLOWED: "the merchant is not on the approved list",
  MANDATE_REVOKED: "the spending mandate had been revoked",
  WINDOW_NOT_OPEN: "the purchase was outside the mandate's time window",
  WINDOW_EXPIRED: "the mandate's time window had already closed",
  CURRENCY_MISMATCH: "the currency did not match the mandate",
  INVALID_AMOUNT: "the amount was malformed",
  MANDATE_NOT_FOUND: "no signed mandate existed for this agent",
  MANDATE_TAMPERED: "the stored mandate no longer matched its signature",
};

function fmtDate(iso) {
  try { return new Date(iso).toLocaleString(undefined, { dateStyle: "long", timeStyle: "short" }); }
  catch { return iso; }
}

async function main() {
  const root = $("#root");
  if (!kind) {
    root.innerHTML = '<p style="color:var(--muted)">Unknown artifact id. Ids start with <code>rcpt-</code> or <code>deny-</code>.</p>';
    return;
  }
  let data;
  try {
    data = await fetch(`/api/verify/${kind}/${id}`).then((r) => r.json());
  } catch {
    root.innerHTML = '<p style="color:var(--muted)">verification service unreachable</p>';
    return;
  }
  if (data.error) {
    root.innerHTML = `<p style="color:var(--muted)">${esc(data.error)}</p>`;
    return;
  }
  const { report, chain, full } = data;
  const isReceipt = report.subject === "receipt";
  const art = isReceipt ? full.receipt : full.denial;
  const mandate = full.mandate;

  // ---------- human lens ----------
  const when = fmtDate(art.createdAt);
  let human;
  if (isReceipt) {
    human = `
      <p class="story">
        On <b>${esc(when)}</b>, the agent <b>${esc(mandate ? mandate.agent : "unknown")}</b> spent
        <span class="num">${esc(full.receipt.amount)} ${esc(full.receipt.currency)}</span>
        ${full.receipt.payee ? `at merchant <b>${esc(full.receipt.payee)}</b>` : ""} for
        “${esc(full.receipt.description)}”.
        ${mandate ? `That purchase ran under a spending mandate signed by <b>${esc(mandate.principal)}</b>
        — max ${esc(mandate.limits.maxPerTransaction)} ${mandate.limits.currency} per purchase,
        ${esc(mandate.limits.maxTotalSpend)} ${mandate.limits.currency} in total.` : ""}
        The money moved once, through PayPal (${esc(full.railsMode)} rails), and cannot be moved twice:
        the same request replayed returns the same receipt.
      </p>
      <p class="story" style="margin-top:12px">
        This page re-checked every signature and the tamper-evident journal
        <b>just now</b>: everything matches. Nobody — including us — can silently change this record.
      </p>`;
  } else {
    const plain = PLAIN_REASON[full.denial.reasonCode] ?? full.denial.reasonDetail;
    human = `
      <p class="story">
        On <b>${esc(when)}</b>, the agent <b>${esc(mandate ? mandate.agent : "unknown")}</b> tried to spend
        <span class="num">${esc(full.denial.requested.amount)} ${esc(full.denial.requested.currency)}</span>
        ${full.denial.requested.payee ? `at merchant <b>${esc(full.denial.requested.payee)}</b>` : ""} for
        “${esc(full.denial.requested.description)}” — and <b>was blocked</b>: ${esc(plain)}.
        ${mandate ? `The limits it was fighting come from a mandate signed by <b>${esc(mandate.principal)}</b>.` : ""}
        No money moved.
      </p>
      <p class="story" style="margin-top:12px">
        The refusal is <b>signed</b>, like a receipt. “The agent tried and was stopped” is provable —
        an agent cannot quietly retry its way past the human's decision.
      </p>`;
  }
  const humanChecks = `
    <section>
      <h2>What this means, concretely</h2>
      ${report.checks.map((c) => `
        <div class="plainline">
          <span class="mark ${c.ok ? "ok" : "bad"}">${c.ok ? "✓" : "✗"}</span>
          <span>${plainLabel(c.label)}</span>
        </div>`).join("")}
      <div class="plainline">
        <span class="mark ${chain.ok ? "ok" : "bad"}">${chain.ok ? "✓" : "✗"}</span>
        <span>The full activity journal is intact and untampered as of right now.</span>
      </div>
    </section>`;
  const facts = `
    <div class="facts">
      <div class="fact"><div class="k">${isReceipt ? "Spent" : "Attempted"}</div><div class="v">${esc(isReceipt ? full.receipt.amount : full.denial.requested.amount)} ${esc(isReceipt ? full.receipt.currency : full.denial.requested.currency)}</div></div>
      <div class="fact"><div class="k">${isReceipt ? "Merchant" : "Merchant"}</div><div class="v">${esc((isReceipt ? full.receipt.payee : full.denial.requested.payee) ?? "—")}</div></div>
      <div class="fact"><div class="k">When</div><div class="v">${esc(art.createdAt.slice(0, 16).replace("T", " "))}</div></div>
      ${mandate ? `<div class="fact"><div class="k">Signed by</div><div class="v">${esc(mandate.principal)}</div></div>` : ""}
      <div class="fact"><div class="k">Status</div><div class="v">${isReceipt ? '<span class="pill ok">COMPLETED</span>' : '<span class="pill no">BLOCKED</span>'}</div></div>
    </div>`;

  // ---------- evidence lens (the technical record) ----------
  const evidence = `
    <section>
      <h2>Cryptographic checks</h2>
      ${report.checks.map((c) => `
        <div class="check">
          <span class="mark ${c.ok ? "ok" : "bad"}">${c.ok ? "✓" : "✗"}</span>
          <span>${esc(c.label)}</span>
          ${c.detail ? `<span class="detail">${esc(c.detail)}</span>` : ""}
        </div>`).join("")}
      <div class="check">
        <span class="mark ${chain.ok ? "ok" : "bad"}">${chain.ok ? "✓" : "✗"}</span>
        <span>Sealed journal intact at verification time</span>
        <span class="detail">${chain.length} events · tip ${esc(chain.tip.slice(0, 16))}…</span>
      </div>
    </section>

    <section>
      <h2>Artifact</h2>
      <div class="kv">
        <div class="k">Type</div><div>${isReceipt ? '<span class="pill ok">PURCHASE RECEIPT</span>' : '<span class="pill no">PURCHASE REFUSAL</span>'}</div>
        <div class="k">Id</div><div class="mono">${esc(report.id)}</div>
        <div class="k">Amount</div><div>${esc(isReceipt ? full.receipt.amount : full.denial.requested.amount)} ${esc(isReceipt ? full.receipt.currency : full.denial.requested.currency)}${isReceipt ? "" : " (refused)"}</div>
        <div class="k">Mandate</div><div class="mono">${esc(art.mandateId)}</div>
        ${isReceipt ? `
          <div class="k">PayPal order</div><div class="mono">${esc(full.receipt.orderId)} (capture ${esc(full.receipt.captureId)}, rails: ${esc(full.railsMode)})</div>
          <div class="k">For</div><div>${esc(full.receipt.description)}</div>` : `
          <div class="k">Refusal reason</div><div>[${esc(full.denial.reasonCode)}] ${esc(full.denial.reasonDetail)}</div>`}
        <div class="k">Issued at</div><div class="mono">${esc(art.createdAt)}</div>
        <div class="k">Principal → Agent</div><div>${mandate ? `${esc(mandate.principal)} → ${esc(mandate.agent)} · ${esc(mandate.purpose)}` : "<i>mandate not bundled</i>"}</div>
        ${mandate ? `
          <div class="k">Limits</div><div class="mono">max ${esc(mandate.limits.maxPerTransaction)} / total ${esc(mandate.limits.maxTotalSpend)} ${esc(mandate.limits.currency)} · window ${esc(mandate.limits.windowStart.slice(0, 10))} → ${esc(mandate.limits.windowEnd.slice(0, 10))}</div>` : ""}
      </div>
    </section>

    ${isReceipt && full.events.length ? `
    <section>
      <h2>Journal events for this operation</h2>
      <table>
        <tr><th>seq</th><th>type</th><th>hash</th></tr>
        ${full.events.map((e) => `<tr><td>${e.seq}</td><td>${esc(e.type)}</td><td>${esc(e.hash.slice(0, 32))}…</td></tr>`).join("")}
      </table>
    </section>` : ""}

    <section>
      <h2>Raw evidence bundle</h2>
      <pre>${esc(JSON.stringify(full, null, 2))}</pre>
    </section>`;
  // (kept in one section for the raw bundle to avoid a bare <details> in the light theme)

  /** The technical check labels, restated for the human lens. */
  function plainLabel(label) {
    const l = label.toLowerCase();
    if (l.includes("mandate signature")) return "The spending mandate's signature is genuine";
    if (l.includes("receipt signature") || l.includes("denial signature")) return isReceipt ? "This receipt's signature is genuine" : "This refusal's signature is genuine";
    if (l.includes("merkle")) return "This record is provably part of the full activity history";
    if (l.includes("tree head")) return "The history summary it commits to is signed";
    if (l.includes("anchor") || l.includes("tsa") || l.includes("timestamp")) return "An independent time authority confirms when it was recorded";
    if (l.includes("journal") || l.includes("chain")) return "The activity journal chain is intact";
    return label;
  }

  root.innerHTML = `
    <div class="verdict ${report.overall ? "ok" : "bad"}">
      ${report.overall ? (isReceipt ? "VERIFIED — this receipt is genuine" : "VERIFIED — this refusal is genuine") : "VERIFICATION FAILED"}
      <span class="mono" style="font-size:13px;font-weight:400;margin-left:8px">${esc(report.id)}</span>
    </div>
    <div class="lens">
      <button id="lens-human" class="active">Summary</button>
      <button id="lens-evidence">Full evidence</button>
    </div>
    <div id="view-human">${human}${facts}${humanChecks}</div>
    <div id="view-evidence" style="display:none">${evidence}</div>`;

  const byId = (id) => document.getElementById(id);
  const show = (which) => {
    byId("view-human").style.display = which === "human" ? "block" : "none";
    byId("view-evidence").style.display = which === "evidence" ? "block" : "none";
    byId("lens-human").classList.toggle("active", which === "human");
    byId("lens-evidence").classList.toggle("active", which === "evidence");
  };
  byId("lens-human").onclick = () => show("human");
  byId("lens-evidence").onclick = () => show("evidence");
}

main();
</script>
</body>
</html>
