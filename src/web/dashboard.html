<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dispute cockpit — Carte Blanche</title>
<script src="/vendor/ag-grid-community.min.js"></script>
<script src="/vendor/charts/ag-charts-community.min.js"></script>
<link rel="stylesheet" href="/vendor/bryntum/calendar.css" />
<link rel="stylesheet" href="/vendor/bryntum/stockholm-dark.css" />
<script src="/vendor/bryntum/calendar.umd.js"></script>
<style>
  :root {
    --bg: #0a0f16; --panel: #101823; --border: #1e2a3a; --text: #e6edf3;
    --muted: #8b98a9; --green: #34d399; --red: #f87171; --amber: #fbbf24; --blue: #60a5fa;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
  a { color: var(--blue); text-decoration: none; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; }
  h1 .card { display: inline-block; background: #fff; color: #0a0f16; border-radius: 6px; padding: 1px 9px; font-weight: 800; }
  .back { font-size: 13px; color: var(--muted); }
  .statusline { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 10px; letter-spacing: 0.5px; }
  .pill.mock { background: rgba(139,152,169,.15); color: var(--muted); }
  .pill.paypal { background: rgba(96,165,250,.14); color: var(--blue); }
  .pill.open { background: rgba(251,191,36,.12); color: var(--amber); }
  .pill.review { background: rgba(96,165,250,.14); color: var(--blue); }
  .pill.dead { background: rgba(248,113,113,.14); color: var(--red); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  button { background: #2563eb; border: 0; color: #fff; font-weight: 600; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13.5px; }
  button:hover { background: #1d4ed8; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); font-weight: 500; }
  button.ghost:hover { color: var(--text); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #grid { height: 340px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .row-hot { background: rgba(248,113,113,0.08) !important; }
  .row-hot td[role="gridcell"] { border-bottom-color: rgba(248,113,113,0.25); }
  .input { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; min-width: 220px; }
  .input::placeholder { color: var(--muted); }
  #livePill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--green); }
  #livePill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); opacity: 0.35; transition: opacity 0.15s; }
  #livePill.on .dot { opacity: 1; box-shadow: 0 0 8px var(--green); }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .chart { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .chart h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .drawer { display: none; margin-top: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .drawer.show { display: block; }
  .drawer h2 { font-size: 15px; margin: 0 0 10px; }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 4px 14px; font-size: 13.5px; margin-bottom: 14px; }
  .kv .k { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .tabs { display: flex; gap: 6px; margin: 12px 0 8px; }
  .tabs button { font-size: 12.5px; padding: 5px 12px; }
  .tabs button.active { background: #1e293b; }
  pre.pack { background: #0b121c; border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 11.5px; overflow: auto; max-height: 420px; white-space: pre-wrap; font-family: var(--mono); }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .empty { color: var(--muted); font-style: italic; font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="card">CARTE</span> BLANCHE · dispute cockpit</h1>
    <span id="livePill"><span class="dot"></span>LIVE</span>
    <a class="back" href="/">← console</a>
    <span id="sourcePill" style="margin-left:auto"></span>
  </header>
  <p class="statusline" id="statusline">loading disputes…</p>

  <div class="toolbar">
    <input class="input" id="quickFilter" placeholder="filter disputes…" />
    <button class="ghost" id="refresh">↻ refresh</button>
    <button class="ghost" id="exportCsv">⬇ csv</button>
    <button id="viewDeadlines">🗓 deadlines timeline</button>
    <button class="ghost" id="viewGrid" style="display:none">↩ back to grid</button>
    <button id="seed" style="display:none">Seed a SAMPLE dispute (sandbox)</button>
    <span class="hint" id="toolhint"></span>
  </div>

  <div id="grid"></div>
  <div id="calendar" style="display:none"></div>
  <div class="empty" id="empty" style="display:none">No disputes on file. Make a purchase in the console first (mock mode seeds rows from your receipts).</div>

  <div class="charts">
    <div class="chart"><h3>disputes by status</h3><div id="chartStatus" style="height:200px"></div></div>
    <div class="chart"><h3>amount by reason</h3><div id="chartReason" style="height:200px"></div></div>
  </div>

  <div class="drawer" id="drawer">
    <h2 id="d-title">—</h2>
    <div class="kv" id="d-kv"></div>
    <div class="tabs">
      <button id="tab-md" class="active">evidence pack (markdown)</button>
      <button id="tab-json">raw JSON</button>
      <span style="flex:1"></span>
      <button class="ghost" id="dl-md">⬇ .md</button>
      <button class="ghost" id="dl-json">⬇ .json</button>
      <button id="submit">Submit evidence</button>
    </div>
    <pre class="pack" id="d-pack">generate the pack to preview it…</pre>
    <div class="hint" id="d-hint"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let SOURCE = "mock";
let CURRENT = null;      // selected dispute row
let PACK = null;         // { pack, markdown }

function statusPill(status) {
  const s = String(status || "").toUpperCase();
  if (s.includes("UNDER")) return '<span class="pill review">' + esc(status) + "</span>";
  if (s.includes("WAITING")) return '<span class="pill open">' + esc(status) + "</span>";
  if (s.includes("WON")) return '<span class="pill won">' + esc(status) + "</span>";
  if (s.includes("LOST")) return '<span class="pill dead">' + esc(status) + "</span>";
  return '<span class="pill mock">' + esc(status) + "</span>";
}

function daysLeft(respondBy) {
  if (!respondBy) return null;
  return Math.ceil((Date.parse(respondBy) - Date.now()) / 864e5);
}

const gridOptions = {
  theme: agGrid.themeQuartz.withParams({
    darkMode: true,
    accentColor: "#2563eb",
    borderColor: "#1e2a3a",
    backgroundColor: "#101823",
    foregroundColor: "#e6edf3",
    headerTextColor: "#8b98a9",
    rowHoverColor: "#16202e",
  }),
  defaultColDef: { sortable: true, filter: true, resizable: true, floatingFilter: true, flex: 1, minWidth: 90 },
  columnDefs: [
    { field: "respondBy", headerName: "Deadline", pinned: "left", minWidth: 150, flex: 1.2,
      valueGetter: (p) => { const d = daysLeft(p.data?.respondBy); return d === null ? "—" : d + " day" + (d === 1 ? "" : "s") + " left"; },
      cellRenderer: (p) => { const d = daysLeft(p.data?.respondBy); if (d === null) return "—";
        const cls = d <= 3 ? "pill dead" : "pill open"; return '<span class="' + cls + '">' + d + "d left</span>"; },
      comparator: (a, b) => String(a).localeCompare(String(b)), sort: "asc" },
    { field: "disputeId", headerName: "Dispute", minWidth: 140,
      cellRenderer: (p) => '<span class="mono">' + esc(p.value) + "</span>" },
    { field: "status", headerName: "Status", minWidth: 170, cellRenderer: (p) => statusPill(p.value) },
    { field: "reason", headerName: "Reason", minWidth: 200 },
    { headerName: "Amount", minWidth: 110,
      valueGetter: (p) => (p.data?.amount ?? "—") + " " + (p.data?.currency ?? "") },
    { headerName: "Linked receipt", minWidth: 180,
      valueGetter: (p) => p.data?.linkedReceiptId ?? "—",
      cellRenderer: (p) => p.value === "—" ? "—" : '<span class="mono">' + esc(p.value) + "</span>" },
    { field: "source", headerName: "Source", minWidth: 100,
      cellRenderer: (p) => p.value === "paypal" ? '<span class="pill paypal">PAYPAL</span>' : '<span class="pill mock">MOCK</span>' },
  ],
  rowData: [],
  getRowId: (p) => String(p.data.disputeId),
  rowClassRules: {
    "row-hot": (p) => { const d = daysLeft(p.data?.respondBy); return d !== null && d <= 3; },
  },
  rowSelection: { mode: "singleRow", checkboxes: false, enableClickSelection: true },
  onRowClicked: (e) => selectDispute(e.data),
};

const gridApi = agGrid.createGrid($("grid"), gridOptions);

// Column layout survives reloads — an operator's cockpit, not a demo.
const COL_STATE_KEY = "cb-cockpit-columns";
gridApi.addEventListener("columnEverythingChanged", () => {
  const saved = localStorage.getItem(COL_STATE_KEY);
  if (saved) gridApi.applyColumnState({ state: JSON.parse(saved), applyOrder: true });
});
gridApi.addEventListener("columnStateUpdated", (e) => {
  try { localStorage.setItem(COL_STATE_KEY, JSON.stringify(e.columnState)); } catch {}
});

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || JSON.stringify(data));
  return data;
}

// --- single writer: refresh and live feed both diff through transactions ----
const seen = new Map(); // disputeId -> fingerprint
const fingerprint = (d) => [d.status, d.reason, d.respondBy, d.linkedReceiptId, d.amount].join("|");

function applyDisputes(rows) {
  const unique = new Map((rows || []).filter((d) => d && d.disputeId).map((d) => [d.disputeId, d]));
  const add = [], update = [];
  for (const [id, d] of unique) {
    const fp = fingerprint(d);
    if (!seen.has(id)) add.push(d);
    else if (seen.get(id) !== fp) update.push(d);
    seen.set(id, fp);
  }
  const remove = [...seen.keys()].filter((id) => !unique.has(id));
  for (const id of remove) seen.delete(id);
  if (add.length || update.length || remove.length) {
    gridApi.applyTransactionAsync({ add, update, remove }, () => updateCharts(rows));
  }
  updateCharts(rows);
  const has = unique.size > 0;
  const inTimeline = view === "timeline";
  $("empty").style.display = has || inTimeline ? "none" : "block";
  $("grid").style.display = has && !inTimeline ? "block" : "none";
  // An operator lands on the hottest case: auto-open the most urgent open
  // dispute (smallest days-left) the first time the table fills.
  if (!CURRENT && has) {
    const hottest = [...unique.values()]
      .filter((d) => d.respondBy)
      .sort((a, b) => Date.parse(a.respondBy) - Date.parse(b.respondBy))[0];
    if (hottest) selectDispute(hottest); // sets CURRENT itself
  }
}

function pulseLive() {
  const pill = $("livePill");
  if (!pill) return;
  pill.classList.add("on");
  setTimeout(() => pill.classList.remove("on"), 700);
}

// --- charts: community edition, dark, updated with the same data ------------
const charts = { status: null, reason: null };
const chartFactory = () => window.agCharts && window.agCharts.AgCharts;

function updateCharts(disputes) {
  const Charts = chartFactory();
  if (!Charts) return;
  const byStatus = {};
  const byReason = {};
  for (const d of disputes || []) {
    const st = d.status || "unknown";
    byStatus[st] = (byStatus[st] || 0) + 1;
    if (d.amount != null) {
      const key = (d.reason || "unknown").toLowerCase().replaceAll("_", " ");
      byReason[key] = (byReason[key] || 0) + Number(d.amount) || 0;
    }
  }
  const statusData = Object.entries(byStatus).map(([status, count]) => ({ status, count }));
  const reasonData = Object.entries(byReason).map(([reason, total]) => ({ reason, total }));
  // AG Charts v14 instance.update() does not reliably re-render inside the
  // wrapper — destroy and recreate instead; ticks are seconds apart.
  for (const key of ["status", "reason"]) {
    if (charts[key]) {
      try { charts[key].releaseChart(); } catch { /* already gone */ }
      charts[key] = null;
    }
  }
  if (statusData.length) {
    $("chartStatus").replaceChildren(); // releaseChart leaves the old canvas behind
    charts.status = Charts.create({
      container: $("chartStatus"),
      data: statusData,
      series: [{ type: "bar", xKey: "status", yKey: "count", fill: "#60a5fa" }],
      axes: [{ type: "category", position: "bottom" }, { type: "number", position: "left" }],
      height: 190,
    });
  }
  if (reasonData.length) {
    $("chartReason").replaceChildren();
    charts.reason = Charts.create({
      container: $("chartReason"),
      data: reasonData,
      series: [{ type: "bar", xKey: "reason", yKey: "total", fill: "#34d399" }],
      axes: [{ type: "category", position: "bottom" }, { type: "number", position: "left" }],
      height: 190,
    });
  }
}

const stream = new EventSource("/api/stream");
stream.onmessage = (msg) => {
  let snap;
  try { snap = JSON.parse(msg.data); } catch { return; }
  pulseLive();
  if (snap.journal) {
    $("statusline").textContent = seen.size + " dispute(s) · journal sealed at " + snap.journal.length + " event(s) · live feed";
  }
  if (Array.isArray(snap.disputes)) applyDisputes(snap.disputes);
};

// --- Bryntum deadlines timeline ----------------------------------------------
// Every dispute becomes an event spanning opened → respond-by, colored by
// urgency; the merchant sees the whole 10-day window at a glance.
let calendar = null;
function rowsForTimeline() {
  return gridApi.getRenderedNodes().map((n) => n.data).filter(Boolean);
}
function buildCalendar(rows) {
  if (!window.bryntum || !bryntum.Calendar) return;
  const now = Date.now();
  const events = rows
    .filter((d) => d.respondBy)
    .map((d) => {
      const end = new Date(Date.parse(d.respondBy));
      const start = d.openedAt ? new Date(Date.parse(d.openedAt)) : new Date(end.getTime() - 10 * 864e5);
      const left = Math.ceil((end.getTime() - now) / 864e5);
      return {
        id: d.disputeId,
        resourceId: "merchant",
        name: d.disputeId + " · respond in " + Math.max(left, 0) + "d",
        startDate: start,
        endDate: end,
        eventColor: left <= 3 ? "red" : left <= 7 ? "orange" : "indigo",
      };
    });
  if (calendar) {
    calendar.eventStore.data = events;
    return;
  }
  calendar = new bryntum.Calendar({
    appendTo: "calendar",
    date: new Date(),
    resources: [{ id: "merchant", name: "Merchant disputes" }],
    events,
    modes: { agenda: { type: "agenda" }, month: true, week: true, year: false, day: false },
    eventRenderer: ({ eventRecord }) => '<b>' + esc(eventRecord.name) + "</b>",
  });
}
let view = "grid";
$("viewDeadlines").onclick = () => {
  view = "timeline";
  $("grid").style.display = "none";
  $("calendar").style.display = "block";
  $("viewDeadlines").style.display = "none";
  $("viewGrid").style.display = "inline-block";
  buildCalendar(rowsForTimeline());
};
$("viewGrid").onclick = () => {
  view = "grid";
  $("calendar").style.display = "none";
  $("grid").style.display = "block";
  $("viewGrid").style.display = "none";
  $("viewDeadlines").style.display = "inline-block";
};

loadDisputes().catch((e) => { $("statusline").textContent = "error: " + e.message; });
</script>
</body>
</html>
